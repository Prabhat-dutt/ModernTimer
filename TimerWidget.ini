[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=0

[Variables]
TaskTitle=nbn
PresetTime=60
CurrentSeconds=60
TimeInputDefault=00:01:00
IsTimerMode=1
IsPaused=1
IsDarkMode=1
IsLightMode=0
IsPlayHidden=0
IsPauseHidden=1
IsTimerHidden=0
IsStopwatchHidden=1
IsTitleViewHidden=0
IsTitleEditHidden=1
IsTimeDisplayHidden=0
IsTimeEditHidden=1
IsEditPenHidden=0
IsInfoOpen=0

; --- COLOR DESIGN SYSTEM ---
BgColor=30,30,30,255
DarkTextColor=245,245,245,255
MutedTextColor=150,150,150,255
ButtonBg=55,55,55,255
GrayRing=60,60,60,255
LimeColor=180,240,40,255

[ScriptEngine]
Measure=Script
ScriptFile=#CURRENTPATH#FormatTime.lua

[MeasureProgress]
Measure=Calc
Formula=[ScriptEngine:GetProgress()]
DynamicVariables=1
MinValue=0
MaxValue=1

; =============================================
; SURFACE CARD CONTAINER
; =============================================

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,320,380,24 | Fill Color #BgColor# | StrokeWidth 0
DynamicVariables=1

; =============================================
; TOP BAR CONTROLS & SINGLE THEME TOGGLE
; =============================================

; --- INFO TOGGLE & PANEL ---
[MeterInfoIcon]
Meter=Shape
X=18
Y=18
Shape=Ellipse 8,3.5,1.8 | Fill Color #MutedTextColor# | StrokeWidth 0
Shape2=Rectangle 6.5,7.5,3,9,1.5 | Fill Color #MutedTextColor# | StrokeWidth 0
Shape3=Rectangle 0,0,16,20 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure ScriptEngine "ToggleInfo()"]
ToolTipText="Toggle Info"
DynamicVariables=1

[MeterInfoLogo]
Meter=Shape
X=136
Y=75
Shape=Ellipse 24,27,19.5 | Fill Color 0,0,0,0 | StrokeWidth 5 | Stroke Color #LimeColor#
Shape2=Line 24,27,24,15 | StrokeWidth 5 | Stroke Color #LimeColor# | StrokeLineCap Round
Shape3=Line 24,27,34.5,19.5 | StrokeWidth 5 | Stroke Color #LimeColor# | StrokeLineCap Round
Shape4=Rectangle 19.5,1.5,9,6,1.5 | Fill Color #LimeColor# | StrokeWidth 0
Shape5=Line 12,1.5,36,1.5 | StrokeWidth 5 | Stroke Color #LimeColor# | StrokeLineCap Round
Hidden=(1 - #IsInfoOpen#)
DynamicVariables=1

[MeterInfoTitle]
Meter=String
Text="Modern Timer Widget"
X=160
Y=140
StringAlign=Center
FontColor=#DarkTextColor#
FontFace=Segoe UI Variable Display, Segoe UI Bold
FontSize=16
AntiAlias=1
Hidden=(1 - #IsInfoOpen#)
DynamicVariables=1

[MeterInfoDetails]
Meter=String
Text="By Prabhat Dutt#CRLF#Version: 1.0"
X=160
Y=180
StringAlign=Center
FontColor=#MutedTextColor#
FontFace=Segoe UI
FontSize=11
AntiAlias=1
Hidden=(1 - #IsInfoOpen#)
DynamicVariables=1

[MeterInfoGithubLink]
Meter=String
Text="Visit GitHub"
X=160
Y=218
StringAlign=Center
FontColor=60,160,255,255
FontFace=Segoe UI Semibold
FontSize=11
AntiAlias=1
Hidden=(1 - #IsInfoOpen#)
DynamicVariables=1
LeftMouseUpAction=["https://github.com/Prabhat-dutt/ModernTimer"]
ToolTipText="Open GitHub Repository in browser"

[MeterInfoFooter]
Meter=String
Text="Enjoy Your Time Tracking!"
X=160
Y=250
StringAlign=Center
FontColor=#LimeColor#
FontFace=Bahnschrift, Segoe UI Semibold
FontSize=12
AntiAlias=1
Hidden=(1 - #IsInfoOpen#)
DynamicVariables=1

; Single Dynamic Theme Toggle Icon (Shows Moon in Light mode, Sun in Dark mode)
[MeterNightModeIcon]
Meter=Shape
X=45
Y=18
Shape=Ellipse 8,8,6 | Fill Color #DarkTextColor# | StrokeWidth 0
Shape2=Ellipse 12,5,6 | Fill Color #DarkTextColor# | StrokeWidth 0
Shape3=Combine Shape | Exclude Shape2
Hidden=(#IsDarkMode# + #IsInfoOpen#)
DynamicVariables=1

[MeterNightModeHitbox]
Meter=Image
X=41
Y=14
W=24
H=24
SolidColor=0,0,0,0
LeftMouseUpAction=[!WriteKeyValue Variables IsDarkMode "1"][!WriteKeyValue Variables IsLightMode "0"][!WriteKeyValue Variables BgColor "30,30,30,255"][!WriteKeyValue Variables DarkTextColor "245,245,245,255"][!WriteKeyValue Variables MutedTextColor "150,150,150,255"][!WriteKeyValue Variables ButtonBg "55,55,55,255"][!WriteKeyValue Variables GrayRing "60,60,60,255"][!SetVariable IsDarkMode "1"][!SetVariable IsLightMode "0"][!SetVariable BgColor "30,30,30,255"][!SetVariable DarkTextColor "245,245,245,255"][!SetVariable MutedTextColor "150,150,150,255"][!SetVariable ButtonBg "55,55,55,255"][!SetVariable GrayRing "60,60,60,255"][!UpdateMeter *][!Redraw]
Hidden=(#IsDarkMode# + #IsInfoOpen#)
DynamicVariables=1
ToolTipText="Switch to Dark Mode"

[MeterDayModeIcon]
Meter=Shape
X=45
Y=18
Shape=Ellipse 8,8,3.5 | Fill Color 0,0,0,0 | StrokeWidth 1.5 | Stroke Color #DarkTextColor#
Shape2=Line 8,1,8,0 | StrokeWidth 1.5 | Stroke Color #DarkTextColor#
Shape3=Line 8,15,8,16 | StrokeWidth 1.5 | Stroke Color #DarkTextColor#
Shape4=Line 1,8,0,8 | StrokeWidth 1.5 | Stroke Color #DarkTextColor#
Shape5=Line 15,8,16,8 | StrokeWidth 1.5 | Stroke Color #DarkTextColor#
Shape6=Line 3,3,2,2 | StrokeWidth 1.5 | Stroke Color #DarkTextColor#
Shape7=Line 13,13,14,14 | StrokeWidth 1.5 | Stroke Color #DarkTextColor#
Shape8=Line 3,13,2,14 | StrokeWidth 1.5 | Stroke Color #DarkTextColor#
Shape9=Line 13,3,14,2 | StrokeWidth 1.5 | Stroke Color #DarkTextColor#
Hidden=(#IsLightMode# + #IsInfoOpen#)
DynamicVariables=1

[MeterDayModeHitbox]
Meter=Image
X=41
Y=14
W=24
H=24
SolidColor=0,0,0,0
LeftMouseUpAction=[!WriteKeyValue Variables IsDarkMode "0"][!WriteKeyValue Variables IsLightMode "1"][!WriteKeyValue Variables BgColor "255,255,255,255"][!WriteKeyValue Variables DarkTextColor "20,20,20,255"][!WriteKeyValue Variables MutedTextColor "140,140,140,255"][!WriteKeyValue Variables ButtonBg "242,242,242,255"][!WriteKeyValue Variables GrayRing "240,240,240,255"][!SetVariable IsDarkMode "0"][!SetVariable IsLightMode "1"][!SetVariable BgColor "255,255,255,255"][!SetVariable DarkTextColor "20,20,20,255"][!SetVariable MutedTextColor "140,140,140,255"][!SetVariable ButtonBg "242,242,242,255"][!SetVariable GrayRing "240,240,240,255"][!UpdateMeter *][!Redraw]
Hidden=(#IsLightMode# + #IsInfoOpen#)
DynamicVariables=1
ToolTipText="Switch to Light Mode"

[MeterTitleEditBg]
Meter=Shape
X=75
Y=14
Shape=Rectangle 0,0,190,32,8 | Fill Color #ButtonBg# | StrokeWidth 0
Hidden=(#IsTitleEditHidden# + #IsInfoOpen#)
DynamicVariables=1

[MeterTitle]
Meter=String
Text=#TaskTitle#
X=154
Y=16
FontColor=#DarkTextColor#
FontFace=Segoe UI Variable Display, Segoe UI Semibold
FontSize=13
StringAlign=Center
AntiAlias=1
Hidden=(#IsTitleViewHidden# + #IsInfoOpen#)
DynamicVariables=1

[MeterTitlePenIcon]
Meter=Shape
X=270
Y=16
Shape=Rectangle 0,0,24,24 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path PenPath | Fill Color #MutedTextColor# | StrokeWidth 0
PenPath=14,3 | LineTo 17,6 | LineTo 7,16 | LineTo 4,16 | LineTo 4,13 | ClosePath 1
Hidden=(#IsTitleViewHidden# + #IsInfoOpen#)
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure ScriptEngine "EditTitle()"]
ToolTipText="Click to edit title"

[MeterTitleTickIcon]
Meter=Shape
X=270
Y=16
Shape=Rectangle 0,0,24,24 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Line 7,7, 17,17 | StrokeWidth 2.5 | Stroke Color #LimeColor# | StrokeLineJoin Rounded | StrokeCap Round
Shape3=Line 17,7, 7,17 | StrokeWidth 2.5 | Stroke Color #LimeColor# | StrokeLineJoin Rounded | StrokeCap Round
Hidden=(#IsTitleEditHidden# + #IsInfoOpen#)
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeterTitleInput "Dismiss"]
ToolTipText="Cancel (Press Enter to Save)"

[MeterTitleInput]
Measure=Plugin
Plugin=InputText
X=75
Y=20
W=190
H=20
SolidColor=#ButtonBg#
FontColor=#DarkTextColor#
FontFace=Segoe UI Variable Display, Segoe UI Semibold
FontSize=12
StringAlign=Center
DynamicVariables=1
FocusDismiss=1
OnDismissAction=[!CommandMeasure ScriptEngine "CancelEditTitle()"]
DefaultValue="#TaskTitle#"
Command1=[!CommandMeasure ScriptEngine "SetTaskTitle('$UserInput$')"]

; =============================================
; MODERN THIN LOADER & LARGE INNER PLAY BUTTON
; =============================================

; Outer Thin Background Track
[MeterBaseRing]
Meter=Roundline
X=85
Y=55
W=150
H=150
StartAngle=(Rad(270))
RotationAngle=(Rad(360))
LineStart=72
LineEnd=74
LineColor=#GrayRing#
Solid=1
AntiAlias=1
DynamicVariables=1

; Outer Thin Active Loader Track
Hidden=#IsInfoOpen#

[MeterActiveRing]
Meter=Roundline
MeasureName=MeasureProgress
X=85
Y=55
W=150
H=150
StartAngle=(Rad(270))
RotationAngle=(Rad(360))
LineStart=71
LineEnd=75
LineColor=#LimeColor#
Solid=1
AntiAlias=1
Hidden=(#IsTimerHidden# + #IsInfoOpen#)
DynamicVariables=1

; --- CENTER PLAY/PAUSE INTERACTIVE BUTTON (VLC / MX Player Style) ---
[MeterCenterActionButton]
Meter=Shape
X=97
Y=67
W=126
H=126
Shape=Ellipse 63,63,63 | Fill Color #ButtonBg# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure ScriptEngine "TogglePause()"]
DynamicVariables=1
ToolTipText="Play / Pause"

; Play Button Vector Triangle (Visible when paused - Pure Vector)
Hidden=#IsInfoOpen#

[MeterPlayIcon]
Meter=Shape
X=160
Y=130
Shape=Path PlayPath | Fill Color #DarkTextColor# | StrokeWidth 0
PlayPath=-8,-14 | LineTo -8,14 | LineTo 14,0 | ClosePath 1
Hidden=(#IsPlayHidden# + #IsInfoOpen#)
DynamicVariables=1

; Pause Button Double Bars (Visible when running - Pure Vector)
[MeterPauseIcon]
Meter=Shape
X=160
Y=130
Shape=Rectangle -12,-14,7,28,2 | Fill Color #DarkTextColor# | StrokeWidth 0
Shape2=Rectangle 6,-14,7,28,2 | Fill Color #DarkTextColor# | StrokeWidth 0
Hidden=(#IsPauseHidden# + #IsInfoOpen#)
DynamicVariables=1

; =============================================
; TIME Readout DISPLAY PANEL & PEN ICON
; =============================================

[MeterTimeEditBg]
Meter=Shape
X=30
Y=220
Shape=Rectangle 0,0,230,64,14 | Fill Color #ButtonBg# | StrokeWidth 0
Hidden=(#IsTimeEditHidden# + #IsInfoOpen#)
DynamicVariables=1

[MeterTimeDisplay]
Meter=String
Text=[ScriptEngine:GetFormatted()]
X=145
Y=222
FontColor=#DarkTextColor#
FontFace=Bahnschrift, Segoe UI Variable Display, Segoe UI Semibold
FontSize=36
StringAlign=Center
AntiAlias=1
DynamicVariables=1
InlineSetting=Size | 18
InlinePattern=[hms]
InlineSetting2=Color | #MutedTextColor#
InlinePattern2=[hms]
Hidden=(#IsTimeDisplayHidden# + #IsInfoOpen#)

; Edit Pen Icon (Slanted vector pencil next to display)
[MeterEditPenIcon]
Meter=Shape
X=270
Y=244
Shape=Rectangle 0,0,24,24 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path PenPath | Fill Color #MutedTextColor# | StrokeWidth 0
PenPath=14,3 | LineTo 17,6 | LineTo 7,16 | LineTo 4,16 | LineTo 4,13 | ClosePath 1
Hidden=(#IsEditPenHidden# + #IsInfoOpen#)
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure ScriptEngine "EditTime()"]
ToolTipText="Click to edit time"

; Edit Tick Icon (Checkmark icon visible while editing)
[MeterEditTickIcon]
Meter=Shape
X=270
Y=244
Shape=Rectangle 0,0,24,24 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Line 7,7, 17,17 | StrokeWidth 2.5 | Stroke Color #LimeColor# | StrokeLineJoin Rounded | StrokeCap Round
Shape3=Line 17,7, 7,17 | StrokeWidth 2.5 | Stroke Color #LimeColor# | StrokeLineJoin Rounded | StrokeCap Round
Hidden=(#IsTimeEditHidden# + #IsInfoOpen#)
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeterTimeInput "Dismiss"]
ToolTipText="Cancel (Press Enter to Save)"

[MeterTimeInput]
Measure=Plugin
Plugin=InputText
X=45
Y=230
W=200
H=44
SolidColor=#ButtonBg#
FontColor=#DarkTextColor#
FontFace=Bahnschrift, Segoe UI Variable Display, Segoe UI Semibold
FontSize=34
StringAlign=Center
DynamicVariables=1
FocusDismiss=1
OnDismissAction=[!CommandMeasure ScriptEngine "CancelEditTime()"]
DefaultValue="#TimeInputDefault#"
Command1=[!CommandMeasure ScriptEngine "ParseTimeInput('$UserInput$')"]

; =============================================
; BOTTOM CONTROLS (Dynamic Colored Mode Toggle & Hard Reset)
; =============================================

; TIMER MODE BUTTON (Vibrant Lime Green Background - Visible in Timer Mode)
[MeterTimerModeBtn]
Meter=Shape
X=25
Y=310
Shape=Rectangle 0,0,130,38,10 | Fill Color #LimeColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure ScriptEngine "ToggleMode()"]
Hidden=(#IsTimerHidden# + #IsInfoOpen#)
DynamicVariables=1
ToolTipText="Click to switch to Stopwatch Mode"

; Modern Timer Dial Icon
[MeterTimerIcon]
Meter=Shape
X=37
Y=320
Shape=Ellipse 8,9,6.5 | Fill Color 0,0,0,0 | StrokeWidth 1.8 | Stroke Color 20,20,20,255
Shape2=Line 8,9,8,5.5 | StrokeWidth 1.8 | Stroke Color 20,20,20,255
Shape3=Line 8,9,11.5,9 | StrokeWidth 1.8 | Stroke Color 20,20,20,255
Shape4=Rectangle 6.5,0.5,3,2,0.5 | Fill Color 20,20,20,255 | StrokeWidth 0
Hidden=(#IsTimerHidden# + #IsInfoOpen#)
DynamicVariables=1

[MeterTimerModeLabel]
Meter=String
Text="TIMER"
X=96
Y=319
FontColor=20,20,20,255
FontFace=Bahnschrift, Segoe UI Bold
FontSize=11
StringAlign=Center
AntiAlias=1
Hidden=(#IsTimerHidden# + #IsInfoOpen#)
DynamicVariables=1

; STOPWATCH MODE BUTTON (Electric Cyan Blue Background - Visible in Stopwatch Mode)
[MeterStopwatchModeBtn]
Meter=Shape
X=25
Y=310
Shape=Rectangle 0,0,130,38,10 | Fill Color 60,160,255,255 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure ScriptEngine "ToggleMode()"]
Hidden=(#IsStopwatchHidden# + #IsInfoOpen#)
DynamicVariables=1
ToolTipText="Click to switch to Timer Mode"

; Modern Stopwatch Icon (Dial + Top Plunger)
[MeterStopwatchIcon]
Meter=Shape
X=37
Y=320
Shape=Ellipse 8,9,6.5 | Fill Color 0,0,0,0 | StrokeWidth 1.8 | Stroke Color 255,255,255,255
Shape2=Line 8,9,8,5 | StrokeWidth 1.8 | Stroke Color 255,255,255,255
Shape3=Line 8,9,11.5,6.5 | StrokeWidth 1.8 | Stroke Color 255,255,255,255
Shape4=Rectangle 6.5,0.5,3,2,0.5 | Fill Color 255,255,255,255 | StrokeWidth 0
Shape5=Line 4,0.5,12,0.5 | StrokeWidth 1.8 | Stroke Color 255,255,255,255
Hidden=(#IsStopwatchHidden# + #IsInfoOpen#)
DynamicVariables=1

[MeterStopwatchModeLabel]
Meter=String
Text="STOPWATCH"
X=96
Y=319
FontColor=255,255,255,255
FontFace=Bahnschrift, Segoe UI Bold
FontSize=10
StringAlign=Center
AntiAlias=1
Hidden=(#IsStopwatchHidden# + #IsInfoOpen#)
DynamicVariables=1

; Right Column Button: Hard Reset Arrow
[MeterResetIconBtn]
Meter=Shape
Shape=Rectangle 165,310,130,38,10 | Fill Color #ButtonBg# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure ScriptEngine "Reset()"]
DynamicVariables=1

; Modern Reset Circular Arrow Vector Icon (High Contrast Bold)
Hidden=#IsInfoOpen#

[MeterResetIcon]
Meter=Shape
X=185
Y=329
Shape=Arc 0,-7, 7,0, 7, 7, 0, 1, 1 | Fill Color 0,0,0,0 | StrokeWidth 2.2 | Stroke Color #DarkTextColor#
Shape2=Path ArrowHead | Fill Color #DarkTextColor# | StrokeWidth 0
ArrowHead=3.5,-0.5 | LineTo 10.5,-0.5 | LineTo 7,4 | ClosePath 1
DynamicVariables=1

Hidden=#IsInfoOpen#

[MeterResetIconLabel]
Meter=String
Text="RESET"
X=242
Y=319
FontColor=#DarkTextColor#
FontFace=Bahnschrift, Segoe UI Semibold
FontSize=10
StringAlign=Center
AntiAlias=1
DynamicVariables=1

Hidden=#IsInfoOpen#
